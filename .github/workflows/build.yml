name: Build & Release Nova Browser

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Crear o actualizar Release en GitHub'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Environment and Keystore
        run: |
          # Aceptar licencias del SDK de Android
          yes | sdkmanager --licenses || true

          # Crear .env desde .env.example si no existe
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          # Decodificar debug.keystore si es necesario
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Permisos de ejecución a gradlew
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Nova-Browser-v1.0-debug.apk
          ls -la release-output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Browser-v1.0-APK
          path: release-output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.ref == 'refs/heads/master' && github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Nova Browser v1.0.0' }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## 🚀 Lanzamiento Oficial de Nova Browser v1.0.0

            ¡Bienvenido a la versión oficial de **Nova Browser** para Android!
            Navegador web moderno, ultrarrápido y seguro, potenciado por Inteligencia Artificial con Google Gemini.

            ### 🚀 Novedades y Funcionalidades Incluidas:
            - **✨ Diseño Moderno Nova**: Interfaz en cian eléctrico y zafiro cósmico, optimizada para pantallas AMOLED con Material Design 3.
            - **🤖 Nova AI Copilot**: Asistente inteligente integrado con modelos Google Gemini para resumir páginas web completas, explicar conceptos y responder preguntas en tiempo real.
            - **🛡️ Escudo de Protección Nova (Nova Shield)**: Bloqueador activo de rastreadores, anuncios y telemetría invasiva en tiempo real con contador dinámico.
            - **📖 Modo Lectura (Reader Mode)**: Vista purificada de artículos sin distracciones ni anuncios, cálculo de tiempo de lectura y ajuste tipográfico.
            - **🔍 Búsqueda en la Página (Find in Page)**: Barra flotante interactiva con contador de coincidencias en vivo (`X/Y`) y controles de navegación.
            - **🖥️ Modo Escritorio (Desktop Site)**: Alternancia ágil de User-Agent para solicitar versiones completas de escritorio de cualquier sitio.
            - **🔤 Zoom de Texto Dinámico**: Niveles de escala configurables (80%, 100%, 125%, 150%) para máxima accesibilidad visual.
            - **📲 Compartir con Código QR**: Generador instantáneo de código QR para compartir cualquier URL con otros dispositivos.
            - **📑 Multitarea con Pestañas e Incógnito**: Administrador de pestañas en cuadrícula y modo de incógnito aislado que no registra historial ni cookies.
            - **💾 Almacenamiento Local Seguro**: Historial, marcadores y descargas gestionados localmente con SQLite y Room Database.

            ### 📥 Descarga e Instalación:
            1. Descarga el archivo adjunto **`Nova-Browser-v1.0-debug.apk`** en tu smartphone o tablet Android (Android 7.0 o superior).
            2. Abre el archivo descargado para instalarlo (habilita la opción de "Instalar aplicaciones de fuentes desconocidas" si el sistema lo solicita).
            3. ¡Inicia **Nova Browser** y disfruta de una navegación moderna y fluida con IA!
          files: |
            release-output/Nova-Browser-v1.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
